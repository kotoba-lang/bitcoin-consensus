name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - run: clojure -M:test
      - run: clojure -M:lint
      - run: clojure -M:coverage
      - run: ./scripts/core_script_vectors.sh
      - name: Replay bounded consensus fuzz seed
        run: timeout 90s clojure -M:fuzz 21000000 5000
